<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DXSJ 93.3 Infinite Radio Surigao — Live</title>
<style>
:root{--bg:#0b1020;--fg:#eef1f8;--live:#e5233b;--replay:#f2a900}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.bar{width:min(100%,1100px);display:flex;align-items:center;gap:12px}
.bar h1{font-size:1.05rem;margin:0;flex:1}
#badge{padding:6px 14px;border-radius:99px;font-weight:700;font-size:.9rem;background:var(--replay);color:#111}
#badge.live{background:var(--live);color:#fff}
#badge.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:8px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#badge.live::before{animation:none}}
.frame{width:min(100%,1100px);aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
#note{margin:0;opacity:.75;font-size:.9rem}
body.obs{padding:0;gap:0}
.obs .bar,.obs #note{display:none}
.obs .frame{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
</style></head><body>
<div class="bar"><h1>DXSJ 93.3 Infinite Radio Surigao</h1><span id="badge">OFFLINE</span></div>
<div class="frame"><div id="yt"></div></div>
<p id="note">Loading…</p>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const STATUS_URL = "status.json", REPLAYS_URL = "replays.json";
const OBS = new URLSearchParams(location.search).has("obs"); // OBS mode: unmuted, no UI
if(OBS) document.body.classList.add("obs");
let player, ready=false, mode=null, liveId=null, last=null, status=null, replays=[];
function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt",{width:"100%",height:"100%",
    playerVars:{autoplay:1,mute:OBS?0:1,controls:OBS?0:1,playsinline:1},
    events:{onReady:()=>{ready=true;apply();},
      onStateChange:e=>{ if(e.data===0 && mode==="replay") nextReplay(); },
      onError:()=>{ if(mode==="replay") setTimeout(nextReplay,1500); }}});
}
function nextReplay(){
  const pool = replays.filter(i=>i!==last), list = pool.length ? pool : replays;
  if(!list.length) return;
  last = list[Math.floor(Math.random()*list.length)];
  player.loadVideoById(last);
}
function apply(){
  if(!ready || !status) return;
  if(status.live){
    if(mode!=="live" || liveId!==status.videoId){ mode="live"; liveId=status.videoId; player.loadVideoById(liveId); }
  } else if(mode!=="replay" || !last){ mode="replay"; nextReplay(); }
  const b=document.getElementById("badge");
  b.textContent = status.live ? "LIVE" : "OFFLINE · REPLAY";
  b.className = status.live ? "live" : "";
  document.getElementById("note").textContent = status.live ? "We're on air. Tap the speaker to unmute." : "We're off air right now. Replaying past broadcasts.";
}
async function tick(){
  try{
    const t = "?t=" + Date.now();
    status = await (await fetch(STATUS_URL+t,{cache:"no-store"})).json();
    try{ replays = (await (await fetch(REPLAYS_URL+t,{cache:"no-store"})).json()).ids || []; }catch(e){}
    if(!replays.length && status.replay) replays = [status.replay];
    apply();
  }catch(e){ document.getElementById("note").textContent = "Can't check live status. Retrying…"; }
}
tick(); setInterval(tick, 60000);
</script></body></html>
