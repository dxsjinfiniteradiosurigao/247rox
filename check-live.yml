name: check-live
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python check_live.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name "live-bot"; git config user.email "bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || (git commit -m "update live status" && git push)
